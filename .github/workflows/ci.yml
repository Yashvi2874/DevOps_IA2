name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: App and receiver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: flake8
        working-directory: app
        run: flake8
      - name: pytest
        working-directory: app
        run: pytest -v --cov=orderflow --cov-report=term
      - name: ops-chat tests
        working-directory: monitoring/ops-chat
        run: python -m unittest -v

  monitoring-config:
    name: Prometheus and Alertmanager config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: promtool check config and rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus" \
            prom/prometheus:v3.13.4 check config /etc/prometheus/prometheus.yml
      - name: promtool rule unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring/prometheus:/etc/prometheus" \
            prom/prometheus:v3.13.4 test rules /etc/prometheus/tests/alert_rules_test.yml
      - name: amtool config and routing
        run: |
          AM="docker run --rm --entrypoint amtool -v $PWD/monitoring/alertmanager:/etc/alertmanager prom/alertmanager:v0.34.1"
          $AM check-config /etc/alertmanager/alertmanager.yml
          $AM config routes test --config.file=/etc/alertmanager/alertmanager.yml \
            --verify.receivers=oncall-email,ops-chat alertname=DependencyDown severity=critical
          $AM config routes test --config.file=/etc/alertmanager/alertmanager.yml \
            --verify.receivers=ops-chat alertname=ContainerCPUThrottled severity=warning
          $AM config routes test --config.file=/etc/alertmanager/alertmanager.yml \
            --verify.receivers=heartbeat alertname=Watchdog severity=none

  end-to-end:
    name: Break the app, expect an alert in chat and email
    runs-on: ubuntu-latest
    needs: [unit-tests, monitoring-config]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build
      - name: All Prometheus targets are up
        run: |
          for i in $(seq 1 30); do
            down=$(curl -s localhost:9091/api/v1/targets | python3 -c "import sys,json; print(sum(t['health']!='up' for t in json.load(sys.stdin)['data']['activeTargets']))" || echo 99)
            [ "$down" = "0" ] && { echo "all targets up"; exit 0; }
            sleep 5
          done
          curl -s localhost:9091/api/v1/targets; exit 1
      - name: Heartbeat reaches the ops chat
        run: |
          for i in $(seq 1 30); do
            curl -s localhost:5002/api/heartbeat | grep -q '"healthy": true' && { echo "heartbeat ok"; exit 0; }
            sleep 5
          done
          exit 1
      - name: Inject 50% errors and wait for the critical alert in chat and email
        run: |
          curl -s -X POST localhost:8100/api/chaos/errors -H 'Content-Type: application/json' -d '{"rate": 0.5}'
          for i in $(seq 1 36); do
            chat=$(curl -s localhost:5002/api/messages | grep -c '"name": "HighErrorRate"' || true)
            mail=$(curl -s "localhost:8025/api/v1/messages?limit=20" | grep -c 'HighErrorRate' || true)
            if [ "$chat" != "0" ] && [ "$mail" != "0" ]; then echo "alert delivered to chat and email"; exit 0; fi
            sleep 5
          done
          echo "alert not delivered in 3 minutes"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
