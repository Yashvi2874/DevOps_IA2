global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    environment: ia2-demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # white-box: the app's own /metrics
  - job_name: shop-api
    static_configs:
      - targets: ["shop-api:8000"]
        labels:
          app: orderflow
          service: shop-api

  # black-box: the blackbox exporter calls each URL from outside (standard relabel pattern)
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://shop-api:8000/health"]
        labels: {app: orderflow, service: shop-api, endpoint: health}
      - targets: ["http://shop-api:8000/ready"]
        labels: {app: orderflow, service: shop-api, endpoint: ready}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          app: orderflow
          service: redis

  # per-container CPU and memory; keep only this project's containers
  - job_name: cadvisor
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [name]
        regex: "ia2-.+"
        action: keep

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
