# Alertmanager receives alerts from Prometheus and decides:
#   who hears about them (routing), how they are bundled (grouping),
#   what is hidden because a bigger problem explains it (inhibition),
#   and how often reminders go out (timing).

global:
  resolve_timeout: 5m
  # Mailpit is a local mail server that catches every email and shows it in a
  # web inbox, so the email path is real without needing a Gmail password.
  smtp_smarthost: mailpit:1025
  smtp_from: alertmanager@orderflow.local
  smtp_require_tls: false

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  receiver: ops-chat
  group_by: ["alertname", "service"]
  group_wait: 10s        # collect related alerts for 10 s before the first message
  group_interval: 30s    # wait 30 s before sending an update for the same group
  repeat_interval: 3h    # remind every 3 h while something stays broken
  routes:
    # The always-firing Watchdog goes only to the heartbeat endpoint, often.
    - matchers: ['alertname="Watchdog"']
      receiver: heartbeat
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 1m

    # Critical: email the on-call engineer fast, then keep going (continue)
    # so the same alert also reaches the ops chat through the next route.
    - matchers: ['severity="critical"']
      receiver: oncall-email
      group_wait: 5s
      repeat_interval: 30m
      continue: true

    - matchers: ['severity=~"critical|warning"']
      receiver: ops-chat

receivers:
  - name: ops-chat
    webhook_configs:
      - url: http://ops-chat:5002/hooks/ops-chat
        send_resolved: true

  - name: oncall-email
    email_configs:
      - to: oncall@orderflow.local
        send_resolved: true
        headers:
          Subject: '{{ template "orderflow.email.subject" . }}'
        html: '{{ template "orderflow.email.html" . }}'

  - name: heartbeat
    webhook_configs:
      - url: http://ops-chat:5002/heartbeat
        send_resolved: false

inhibit_rules:
  # Redis is down: the errors, slowness and "not ready" in OrderFlow are
  # symptoms of that, so only the root cause is reported.
  - source_matchers: ['alertname="DependencyDown"']
    target_matchers: ['alertname=~"HighErrorRate|HighLatencyP95|ServiceNotReady"']
    equal: ["app"]

  # The whole service is down: no point also reporting it as slow, failing,
  # unreachable from outside or not ready.
  - source_matchers: ['alertname="ServiceDown"']
    target_matchers: ['alertname=~"EndpointDown|HighErrorRate|HighLatencyP95|ServiceNotReady"']
    equal: ["app"]

  # The health check times out (the app hangs): slowness and "not ready" are
  # the same problem seen from another angle.
  - source_matchers: ['alertname="EndpointDown"']
    target_matchers: ['alertname=~"HighLatencyP95|ServiceNotReady"']
    equal: ["app"]
